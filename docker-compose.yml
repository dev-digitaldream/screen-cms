services:
  screen-cms:
    build: .
    container_name: screen-cms
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - screen-cms-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - TRUST_PROXY=1
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
volumes:
  screen-cms-data:
